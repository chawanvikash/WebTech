<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal SGPA Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="calculator-card" id="calcCard">
        <h2>SGPA Calculator</h2>
        <p class="subtitle">Enter marks (0-100) for your 5 subjects.</p>

        <!-- Inputs generated by JS -->
        <div id="subjectsContainer"></div>

        <div id="errorBox" class="error-msg"></div>
        <button onclick="calculateSGPA()">Calculate Results</button>

        <div id="finalResult">
            <div class="stat"><span>Total Marks:</span> <strong id="outTotal">0 / 500</strong></div>
            <div class="stat"><span>Percentage:</span> <strong id="outPercent">0%</strong></div>
            <div class="sgpa-highlight">SGPA: <span id="outSGPA">0.00</span></div>
            <div id="outStatus" class="status-text"></div>
        </div>
    </div>

</body>
</html>
