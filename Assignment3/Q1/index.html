<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CST Department Faculty Profile - IIEST</title>
    <style>
        /* CSS Variables for Theme Toggling */
        :root {
            --bg-color: #f0f4f8;
            --text-color: #2d3748;
            --card-bg: #ffffff;
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --border-color: #e2e8f0;
            --accent-color: #4c51bf;
            --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --bg-color: #1a202c;
            --text-color: #e2e8f0;
            --card-bg: #2d3748;
            --primary-gradient: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            --border-color: #4a5568;
            --accent-color: #38f9d7;
            --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1000px;
            margin-bottom: 2rem;
        }

        h1 {
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            text-align: center;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 2rem;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        input[type="text"] {
            padding: 12px 20px;
            font-size: 1rem;
            width: 300px;
            border: 2px solid var(--border-color);
            border-radius: 30px;
            background-color: var(--card-bg);
            color: var(--text-color);
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        button {
            padding: 10px 20px;
            font-size: 1rem;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .theme-toggle {
            background: transparent;
            color: var(--text-color);
            border: 2px solid var(--border-color);
            box-shadow: none;
        }

        .faculty-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1200px;
        }

        .profile-card {
            background-color: var(--card-bg);
            border-radius: 15px;
            box-shadow: var(--card-shadow);
            padding: 2rem;
            border-top: 5px solid;
            border-image: var(--primary-gradient) 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--accent-color);
            margin-bottom: 1rem;
        }

        .profile-name {
            font-size: 1.25rem;
            font-weight: bold;
            margin: 0 0 5px 0;
            color: var(--text-color);
        }

        .profile-qual {
            font-size: 0.9rem;
            font-style: italic;
            color: #718096;
            margin-bottom: 15px;
        }

        .profile-details {
            width: 100%;
            text-align: left;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .label {
            font-weight: bold;
            color: var(--accent-color);
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 1.2rem;
            color: red;
            display: none;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>CST Department Faculty Directory</h1>
        
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Search by name..." onkeyup="filterFaculty()">
            <button class="theme-toggle" onclick="toggleTheme()">🌓 Toggle Theme</button>
        </div>
    </div>

    <div id="facultyGrid" class="faculty-grid">
        <!-- Faculty cards will be injected here by JavaScript -->
        <div id="noResults" class="no-results">No faculty members found.</div>
    </div>

    <script src="faculty.js"></script>
</body>
</html>
