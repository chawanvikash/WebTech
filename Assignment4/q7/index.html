<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AJAX Student Management</title>


    <style>

        .box {
            width: 600px;
            margin: 40px auto;
            padding: 20px;
            border: 1px solid #b8c7e0;
            border-radius: 8px;
            background-color: #f4f8ff;
        }

        h2 {
            color: #2563eb;
            text-align: center;
        }

        input, select {
            width: 95%;
            padding: 8px;
            margin: 8px 0;
            border: 1px solid #b8c7e0;
            border-radius: 5px;
        }

        button {
            padding: 8px 15px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .delete {
            background-color: #dc2626;
        }

        .delete:hover {
            background-color: #b91c1c;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            padding: 8px;
            border: 1px solid #b8c7e0;
            text-align: center;
        }

        th {
            background-color: #dbeafe;
        }

    </style>

</head>


<body>

<div class="box">

    <h2>Student Management</h2>


    <!-- ADD STUDENT -->

    <h3>Add Student</h3>

    <input type="text"
           id="name"
           placeholder="Enter student name">

    <input type="text"
           id="department"
           placeholder="Enter department">

    <button onclick="addStudent()">
        Add Student
    </button>


    <hr>


    <!-- DISPLAY STUDENTS -->

    <h3>Student List</h3>

    <button onclick="loadStudents()">
        Load Students
    </button>

    <div id="result"></div>

</div>


<script>


// ADD STUDENT

function addStudent() {

    let name =
        document.getElementById("name").value;

    let department =
        document.getElementById("department").value;


    if (name == "" || department == "") {

        alert("Please enter all details");

        return;
    }


    let formData = new FormData();

    formData.append("name", name);
    formData.append("department", department);


    fetch("students.php", {

        method: "POST",

        body: formData

    })

    .then(response => response.text())

    .then(data => {

        alert(data);

        document.getElementById("name").value = "";

        document.getElementById("department").value = "";

        loadStudents();

    })

    .catch(error => {

        alert("Error adding student");

    });

}



// LOAD STUDENTS

function loadStudents() {

    fetch("students.php")

    .then(response => response.json())

    .then(data => {

        let output = `
        
            <table>

                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Department</th>
                    <th>Action</th>
                </tr>
        
        `;


        data.forEach(student => {

            output += `
            
                <tr>

                    <td>${student.id}</td>

                    <td>${student.name}</td>

                    <td>${student.department}</td>

                    <td>

                        <button
                            class="delete"
                            onclick="deleteStudent(${student.id})">

                            Delete

                        </button>

                    </td>

                </tr>
            
            `;

        });


        output += "</table>";


        document.getElementById("result").innerHTML =
            output;

    })

    .catch(error => {

        document.getElementById("result").innerHTML =
            "Error loading students";

    });

}



// DELETE STUDENT

function deleteStudent(id) {

    if (!confirm("Are you sure you want to delete this student?")) {
        return;
    }


    fetch("students.php?delete=" + id)

    .then(response => response.text())

    .then(data => {

        alert(data);

        loadStudents();

    })

    .catch(error => {

        alert("Error deleting student");

    });

}


</script>

</body>

</html>
